{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-lg-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold text-dark mb-0">Batch Assessment</h2>
            <a href="{{ url_for('customers') }}" class="btn btn-outline-primary btn-sm fw-bold">
                <i class="bi bi-people-fill me-1"></i> Customer Directory
            </a>
        </div>

        <div class="alert alert-info border-0 shadow-sm mb-4">
            <h6 class="fw-bold mb-2"><i class="bi bi-info-circle-fill me-2"></i>Required Column Headers</h6>
            <p class="small text-muted mb-1">Make sure your file includes these columns: <code>tenure</code>, <code>MonthlyCharges</code>, <code>TotalCharges</code>, <code>Contract</code>, <code>InternetService</code>, and <code>PaymentMethod</code>.</p>
        </div>

        <div class="card border-0 shadow-sm p-4 rounded-4">
            <form method="POST" action="{{ url_for('batch_predict') }}" enctype="multipart/form-data">
                <div class="mb-4 text-center p-4 border border-2 border-dashed rounded bg-light">
                    <i class="bi bi-cloud-arrow-up-fill fs-1 text-primary mb-2 d-block"></i>
                    <label for="file" class="form-label fw-bold mb-1">Choose CSV or Excel File</label>
                    <p class="text-muted small mb-3">Accepts .csv, .xls, and .xlsx</p>
                    <input type="file" name="file" id="file" class="form-control w-75 mx-auto" accept=".csv, .xls, .xlsx" required>
                </div>

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary fw-bold py-2 shadow-sm">
                        <i class="bi bi-gear-fill me-1"></i> Process Batch File
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
