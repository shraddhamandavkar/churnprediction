{% extends 'base.html' %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center align-items-center" style="min-height: 60vh;">
        <div class="col-12 col-md-8 col-lg-5">
            <div class="card border-0 shadow rounded-4 p-4 p-sm-5">
                
                <div class="text-center mb-4">
                    <div class="bg-primary-subtle text-primary d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 60px; height: 60px;">
                        <i class="bi bi-person-plus-fill fs-3"></i>
                    </div>
                    <h3 class="fw-bold text-dark mb-1">Create Account</h3>
                    <p class="text-muted small">Sign up as a churn analytics agent</p>
                </div>

                <form action="{{ url_for('register') }}" method="POST">
                    <div class="form-floating mb-3">
                        <input type="text" name="name" class="form-control rounded-3" id="regName" placeholder="Full Name" required>
                        <label for="regName"><i class="bi bi-person me-1"></i> Full Name</label>
                    </div>

                    <div class="form-floating mb-3">
                        <input type="email" name="email" class="form-control rounded-3" id="regEmail" placeholder="name@example.com" required>
                        <label for="regEmail"><i class="bi bi-envelope me-1"></i> Email address</label>
                    </div>

                    <div class="form-floating mb-4">
                        <input type="password" name="password" class="form-control rounded-3" id="regPassword" placeholder="Password" required>
                        <label for="regPassword"><i class="bi bi-key me-1"></i> Password</label>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-3 shadow-sm mb-3">
                        Register Account <i class="bi bi-arrow-right-short ms-1 fs-5"></i>
                    </button>
                </form>

                <div class="text-center mt-3 pt-3 border-top">
                    <p class="text-muted small mb-0">Already registered? 
                        <a href="{{ url_for('login') }}" class="text-primary fw-bold text-decoration-none">Sign In</a>
                    </p>
                </div>

            </div>
        </div>
    </div>
</div>
{% endblock %}
